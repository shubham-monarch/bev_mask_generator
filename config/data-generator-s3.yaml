# s3 destination folder
dest_folder: "bev-dairy-15-02-24"

# json index path
index_json: "index-s3/bev-dairy-15-02-24.json"

# color map config
color_map: "config/dairy.yaml"

# crop bounding box (x is horizontal, z is depth)
crop_bb:
