# s3 source URIs
src_URIs:
  - "s3://occupancy-dataset/occ-dataset/dairy/chino_valley"
  - "s3://occupancy-dataset/occ-dataset/dairy/coolidge"
  - "s3://occupancy-dataset/occ-dataset/dairy/escalon"
  - "s3://occupancy-dataset/occ-dataset/dairy/Fiscalini"
  - "s3://occupancy-dataset/occ-dataset/dairy/ghdairy"
  - "s3://occupancy-dataset/occ-dataset/dairy/grimius"
  - "s3://occupancy-dataset/occ-dataset/dairy/mccarty"
  - "s3://occupancy-dataset/occ-dataset/dairy/mineral_king"
  
# s3 destination folder
dest_folder: "bev-dairy-17-02-24"

# json index path
index_json: "index-s3/bev-dairy-17-02-24.json"

# color map config
color_map: "config/dairy.yaml"

# crop bounding box (x is horizontal, z is depth)
crop_bb:
  x_min: -2.0
  x_max: 3.0
  z_min: 4.0
  z_max: 9.0

# segmentation mask dimensions
nx: 256
nz: 256 

# camera intrinsic matrix for ipm generation (updated values from debug_cases.py)
camera_matrix:
  - [1090.536, 0, 954.99]
  - [0, 1090.536, 523.12]
  - [0, 0, 1]

ipm_bev_size: 256
